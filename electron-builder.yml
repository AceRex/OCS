appId: com.ocs.desktop
productName: OCS
copyright: "Copyright © 2026 Are Oluwasegun Johnson"

directories:
  output: release
  buildResources: build

files:
  - "main.js"
  - "preload.js"
  - "menu.js"
  - "*.html"
  - "assets/**/*"
  - "src/main/**/*"
  - "src/App/utils/**/*"
  - "src/Bible/**/*"
  - "dist/**/*"
  - "package.json"
  - "!ocs-mobile/**/*"
  - "!tests/**/*"
  - "!scripts/**/*"
  - "!temp_output/**/*"
  - "!voice_server/**/*"
  - "!ocs_image_engine/**/*"

asarUnpack:
  - "src/Bible/**/*"
  - "**/*.node"
  - "node_modules/@img/**/*"
  - "node_modules/sharp/**/*"

extraResources:
  - from: "voice_server/models/vosk-model-small-en-us-0.15"
    to: "voice_server/models/vosk-model-small-en-us-0.15"
    filter:
      - "**/*"

publish:
  provider: github
  owner: AceRex
  repo: OCS
  releaseType: release

mac:
  category: public.app-category.lifestyle
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSCameraUsageDescription: "This app needs access to your camera for teleprompter recording."
    NSMicrophoneUsageDescription: "This app needs access to your microphone for live speech alignment."
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OCS
