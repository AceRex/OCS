<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OCS — Workstation Authentication</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0B0814;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #FFFFFF;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .background-glow {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.25) 0%, rgba(6, 182, 212, 0.1) 50%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }
    .login-card {
      position: relative;
      z-index: 1;
      width: 440px;
      background: #161026;
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(124, 58, 237, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .logo-box {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      color: white;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .brand-desc {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
      max-width: 320px;
    }
    .status-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #DDD7EE;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }
    .error-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-size: 12px;
      color: #FCA5A5;
      text-align: left;
      display: none;
    }
    .btn-login {
      width: 100%;
      padding: 14px 20px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35);
      transition: all 0.2s ease;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(124, 58, 237, 0.5);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .waiting-indicator {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(168, 85, 247, 0.2);
      border-top-color: #A855F7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .waiting-text {
      font-size: 13px;
      font-weight: 600;
      color: #C084FC;
    }
    .cancel-link {
      font-size: 12px;
      color: #94A3B8;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 4px;
    }
    .cancel-link:hover {
      color: white;
    }
    .security-note {
      font-size: 11px;
      color: #64748B;
      line-height: 1.4;
    }
    .dev-simulate-box {
      width: 100%;
      margin-top: 8px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-dev {
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #A89EC4;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-dev:hover {
      background: rgba(255, 255, 255, 0.12);
      color: white;
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>

  <div class="login-card">
    <div class="brand-header">
      <div class="logo-box">O</div>
      <h2 class="brand-title">Welcome to OCS</h2>
      <p class="brand-desc">
        Sign in with your organization account to unlock your church presentation suite.
      </p>
    </div>

    <!-- Status Box -->
    <div class="status-box" id="status-box">
      <span>🔒 Workstation activation required (FR-13.1)</span>
    </div>

    <!-- Error Box -->
    <div class="error-box" id="error-box"></div>

    <!-- Primary Action -->
    <div style="width: 100%;" id="action-container">
      <button class="btn-login" id="btn-login">
        <span>Log In via Browser</span>
        <span>➔</span>
      </button>
    </div>

    <!-- Waiting for browser callback -->
    <div class="waiting-indicator" id="waiting-indicator">
      <div class="spinner"></div>
      <div class="waiting-text">Complete login in your browser...</div>
      <div class="cancel-link" id="btn-cancel">Cancel & Retry</div>
    </div>

    <p class="security-note">
      Login opens your system default browser to securely protect credentials and password autofill (FR-13.3).
    </p>

    <!-- Dev / Offline Activation Simulator -->
    <div class="dev-simulate-box">
      <button class="btn-dev" id="btn-simulate-auth">
        ⚡ Demo/QA: Simulate Browser Login Callback
      </button>
    </div>
  </div>

  <script>
    const btnLogin = document.getElementById('btn-login');
    const btnCancel = document.getElementById('btn-cancel');
    const btnSimulate = document.getElementById('btn-simulate-auth');
    const actionContainer = document.getElementById('action-container');
    const waitingIndicator = document.getElementById('waiting-indicator');
    const errorBox = document.getElementById('error-box');
    const statusBox = document.getElementById('status-box');

    let currentPendingState = null;

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function clearError() {
      errorBox.style.display = 'none';
      errorBox.textContent = '';
    }

    btnLogin.addEventListener('click', async () => {
      clearError();
      try {
        actionContainer.style.display = 'none';
        waitingIndicator.style.display = 'flex';
        
        if (window.electron?.Auth?.openBrowserLogin) {
          const res = await window.electron.Auth.openBrowserLogin();
          if (res?.state) currentPendingState = res.state;
        }
      } catch (err) {
        showError(err.message || 'Failed to open browser');
        actionContainer.style.display = 'block';
        waitingIndicator.style.display = 'none';
      }
    });

    btnCancel.addEventListener('click', () => {
      clearError();
      actionContainer.style.display = 'block';
      waitingIndicator.style.display = 'none';
    });

    btnSimulate.addEventListener('click', async () => {
      clearError();
      try {
        if (window.electron?.Auth?.simulateCallback) {
          const res = await window.electron.Auth.simulateCallback();
          if (!res?.ok) {
            showError(res?.error || 'Simulated callback failed');
          }
        }
      } catch (err) {
        showError(err.message || 'Simulate error');
      }
    });

    // Listen for auth errors from main process
    if (window.electron?.Auth?.onAuthError) {
      window.electron.Auth.onAuthError((errMsg) => {
        showError(errMsg);
        actionContainer.style.display = 'block';
        waitingIndicator.style.display = 'none';
      });
    }
  </script>
</body>
</html>
