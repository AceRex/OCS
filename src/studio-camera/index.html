<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OCS Pro Studio Camera</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html {
      width: 100%; height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050508;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Studio Tally Border */
    #tally-border {
      position: absolute;
      inset: 0;
      border: 4px solid rgba(16, 185, 129, 0.7);
      pointer-events: none;
      z-index: 20;
      transition: border-color 0.3s ease;
    }
    #tally-border.rec {
      border-color: #ef4444;
      animation: pulse-border 1s infinite;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(239, 68, 68, 0.95); }
      50% { border-color: rgba(239, 68, 68, 0.4); }
    }
    /* Top HUD Bar */
    .hud-top {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
      padding: 6px 12px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
    .dot.rec { background: #ef4444; animation: ping 1s infinite; }
    @keyframes ping { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }
    .stats {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.75);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    /* Bottom Control Bar */
    .control-deck {
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 30;
    }
    .controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.94); background: rgba(255,255,255,0.3); }
    .btn.active { background: #f59e0b; border-color: #fbbf24; color: #000; }
    .btn-danger { background: rgba(239, 68, 68, 0.85); border-color: #ef4444; }
    /* Zoom Slider */
    .zoom-slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.65);
      padding: 6px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .zoom-slider-container input[type=range] {
      flex: 1;
      accent-color: #8b5cf6;
      height: 4px;
    }
    /* Permission Overlay */
    #start-overlay {
      position: absolute;
      inset: 0;
      background: #08070d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 100;
    }
    #start-overlay h1 { font-size: 24px; margin-bottom: 8px; font-weight: 900; }
    #start-overlay p { font-size: 13px; color: rgba(255,255,255,0.6); max-width: 320px; line-height: 1.5; margin-bottom: 24px; }
    .start-btn {
      background: #7c3aed;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      padding: 16px 36px;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.5);
    }
  </style>
</head>
<body>
  <div id="viewport">
    <video id="localVideo" autoplay playsinline muted></video>
    <canvas id="streamCanvas" style="display:none;"></canvas>
    <div id="tally-border"></div>

    <!-- Top Status -->
    <div class="hud-top">
      <div class="badge">
        <div class="dot" id="tally-dot"></div>
        <span id="tally-text">STUDIO CAM LIVE</span>
      </div>
      <div class="stats" id="stats-hud">1080p • 60 FPS</div>
    </div>

    <!-- Control Deck -->
    <div class="control-deck">
      <div class="controls-row zoom-slider-container" id="zoom-control" style="display:none;">
        <span style="font-size: 11px; font-weight: bold;">🔍 ZOOM</span>
        <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1" />
        <span id="zoomVal" style="font-size: 11px; font-family: monospace;">1.0x</span>
      </div>

      <div class="controls-row">
        <button class="btn" id="torchBtn" style="display:none;">💡 Torch</button>
        <button class="btn" id="flipBtn">🔄 Flip Lens</button>
        <button class="btn btn-danger" id="disconnectBtn">Disconnect</button>
      </div>
    </div>

    <!-- Permission/Launch Screen -->
    <div id="start-overlay">
      <div style="font-size: 48px; margin-bottom: 16px;">📹</div>
      <h1>OCS Broadcast Studio</h1>
      <p>Stream your phone camera directly into the Desktop Teleprompter with hardware-accelerated 60 FPS ultra-low latency.</p>
      <button class="start-btn" id="startBtn">START BROADCAST</button>
    </div>
  </div>

  <script>
    let localStream = null;
    let videoTrack = null;
    let facingMode = "environment";
    let socket = null;
    let isTorchOn = false;
    let currentZoom = 1;
    let frameInterval = null;

    const video = document.getElementById("localVideo");
    const canvas = document.getElementById("streamCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const tallyBorder = document.getElementById("tally-border");
    const tallyDot = document.getElementById("tally-dot");
    const tallyText = document.getElementById("tally-text");
    const statsHud = document.getElementById("stats-hud");
    const torchBtn = document.getElementById("torchBtn");
    const flipBtn = document.getElementById("flipBtn");
    const zoomControl = document.getElementById("zoom-control");
    const zoomRange = document.getElementById("zoomRange");
    const zoomVal = document.getElementById("zoomVal");
    const startOverlay = document.getElementById("start-overlay");
    const startBtn = document.getElementById("startBtn");

    async function initCamera() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: facingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30, max: 60 }
          },
          audio: false
        };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = localStream;
        await video.play();

        videoTrack = localStream.getVideoTracks()[0];
        checkCapabilities();
        startFramePump();
        startOverlay.style.display = "none";
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    }

    function checkCapabilities() {
      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (caps.torch) {
        torchBtn.style.display = "flex";
      } else {
        torchBtn.style.display = "none";
      }
      if (caps.zoom) {
        zoomControl.style.display = "flex";
        zoomRange.min = caps.zoom.min || 1;
        zoomRange.max = Math.min(caps.zoom.max || 5, 5);
        zoomRange.step = caps.zoom.step || 0.1;
      } else {
        zoomControl.style.display = "none";
      }
    }

    function connectSocket() {
      socket = io({ query: { isStudioCamera: "true" }, transports: ["websocket", "polling"] });
      socket.on("connect", () => {
        console.log("[Studio Camera] Socket connected:", socket.id);
        socket.emit("teleprompter:camera-started", { fromId: socket.id });
      });

      socket.on("teleprompter:countdown", (payload) => {
        if (payload?.action === "start") {
          tallyBorder.classList.add("rec");
          tallyDot.classList.add("rec");
          tallyText.innerText = "REC • ON AIR";
        } else if (payload?.action === "cancel") {
          tallyBorder.classList.remove("rec");
          tallyDot.classList.remove("rec");
          tallyText.innerText = "STUDIO CAM LIVE";
        }
      });
    }

    // High-speed low-latency canvas JPEG streamer (~25 FPS adaptive)
    let isPumping = false;
    function startFramePump() {
      if (frameInterval) clearInterval(frameInterval);
      canvas.width = 640;
      canvas.height = 360;

      let frameCounter = 0;
      let lastFpsTime = performance.now();

      frameInterval = setInterval(() => {
        if (!socket || !socket.connected || !video || video.readyState < 2 || isPumping) return;
        isPumping = true;
        try {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.35);
          socket.emit("teleprompter:camera-frame", {
            data: dataUrl,
            timestamp: Date.now()
          });
          frameCounter++;
          const now = performance.now();
          if (now - lastFpsTime >= 1000) {
            const fps = Math.round(frameCounter / ((now - lastFpsTime) / 1000));
            statsHud.innerText = `720p • ${fps} FPS`;
            frameCounter = 0;
            lastFpsTime = now;
          }
        } catch (_) {}
        isPumping = false;
      }, 40); // 25 fps pump
    }

    startBtn.onclick = () => {
      connectSocket();
      initCamera();
    };

    flipBtn.onclick = () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      initCamera();
    };

    torchBtn.onclick = async () => {
      if (!videoTrack) return;
      isTorchOn = !isTorchOn;
      try {
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        torchBtn.classList.toggle("active", isTorchOn);
      } catch (_) {}
    };

    zoomRange.oninput = async (e) => {
      const z = parseFloat(e.target.value);
      zoomVal.innerText = z.toFixed(1) + "x";
      if (!videoTrack) return;
      try {
        await videoTrack.applyConstraints({ advanced: [{ zoom: z }] });
      } catch (_) {}
    };

    document.getElementById("disconnectBtn").onclick = () => {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (socket) socket.disconnect();
      startOverlay.style.display = "flex";
    };
  </script>
</body>
</html>
